<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Milli Fulfillment & Marketplace</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800">

    <!-- Menyu Zolağı -->
    <nav class="bg-indigo-900 text-white px-6 py-4 flex flex-wrap justify-between items-center shadow-md gap-4">
        <a href="/" class="text-xl font-bold tracking-wide">📦 Milli Fulfillment</a>
        
        <div class="flex items-center space-x-4 text-sm font-medium">
            <a href="/" class="hover:underline">Vitrin (Məhsullar)</a>
            
            {% if current_customer %}
                <span class="bg-indigo-800 border border-indigo-700 px-3 py-1 rounded text-emerald-300 font-semibold">
                    👤 Salam, {{ current_customer.full_name }}
                </span>
                <a href="/customer/logout" class="text-xs text-gray-400 hover:text-white underline">Çıxış</a>
            {% else %}
                <a href="/customer-auth" class="hover:underline">Alıcı Qeydiyyatı</a>
            {% endif %}

            <a href="/seller/register" class="bg-indigo-700 px-3 py-1.5 rounded hover:bg-indigo-600 transition">Satıcı Ol</a>
        </div>
    </nav>

    <!-- Əsas Səhifə Hissəsi -->
    <main class="container mx-auto p-6">
        {% block content %}{% endblock %}
    </main>

</body>
</html>
